name: Build & Release Voice Bubble APK

on:
  push:
    branches:
      - 'release/v*' # versioned release branch pushes
    tags:
      - 'v*' # tagged releases
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Version Tag (e.g., v1.0.1)'
        required: false
        default: 'v1.0.0'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Extract Version Tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version_tag }}" ]; then
            TAG_NAME="${{ github.event.inputs.version_tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          elif [[ "$GITHUB_REF" == refs/heads/release/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/heads/release/}"
          else
            echo "::error::Unable to determine release tag from ref: $GITHUB_REF"
            exit 1
          fi
          VERSION_NAME="${TAG_NAME#v}"
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
            echo "Keystore decoded successfully."
          else
            echo "No production keystore secret found, fallback to debug signing."
          fi

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease -PversionName=${{ env.VERSION_NAME }} --stacktrace

      - name: Verify update signing compatibility
        run: |
          set -euo pipefail
          APK_FILE=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -iname '*unsigned*' | sort | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::A signed Release APK was not produced."
            find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print || true
            exit 1
          fi
          echo "Checking signed APK: $APK_FILE"

          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          APKSIGNER="$(command -v apksigner 2>/dev/null || true)"

          if [ -z "$APKSIGNER" ]; then
            for SDK_ROOT in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" \
              "/usr/local/lib/android/sdk" "/usr/lib/android-sdk" \
              "/opt/android-sdk" "/home/runner/Android/Sdk" \
              "/opt/hostedtoolcache/android-sdk"; do
              if [ -n "$SDK_ROOT" ] && [ -d "$SDK_ROOT" ]; then
                APKSIGNER=$(find "$SDK_ROOT" -name apksigner 2>/dev/null | sort -V | tail -n 1)
                if [ -n "$APKSIGNER" ]; then break; fi
              fi
            done
          fi

          if [ -z "$APKSIGNER" ]; then
            # Last-resort search for SDKs installed outside the standard runner paths.
            APKSIGNER=$(find / -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          fi

          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::Android apksigner could not be found; refusing to publish an unverified update."
            exit 1
          fi
          echo "Using apksigner: $APKSIGNER"

          cert_digest() {
            local APK_PATH="$1"
            local VERIFY_OUTPUT
            VERIFY_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK_PATH" 2>&1) || {
              echo "::error::apksigner could not verify $APK_PATH" >&2
              printf '%s\n' "$VERIFY_OUTPUT" >&2
              return 1
            }
            printf '%s\n' "$VERIFY_OUTPUT" |
              awk -F': ' '/Signer #1 certificate SHA-256 digest/ { print $2; exit }'
          }

          NEW_CERT=$(cert_digest "$APK_FILE") || {
            echo "::error::Could not verify the new APK signature."
            exit 1
          }
          if [ -z "$NEW_CERT" ]; then
            echo "::error::apksigner output did not contain a SHA-256 certificate digest for the new APK."
            "$APKSIGNER" verify --print-certs "$APK_FILE" 2>&1 || true
            exit 1
          fi
          echo "New APK signing certificate SHA-256: $NEW_CERT"

          for TAG in v1.0.0 v1.0.1 v1.0.2; do
            OLD_APK="$RUNNER_TEMP/$TAG.apk"
            curl --fail --location --silent --show-error \
              "https://github.com/engrnirzorme02/NIRZOR-Voice-Typing-floating/releases/download/$TAG/voicebubble.apk" \
              --output "$OLD_APK"

            OLD_CERT=$(cert_digest "$OLD_APK")
            if [ -z "$OLD_CERT" ]; then
              echo "::error::Could not read signing certificate from release $TAG."
              exit 1
            fi

            echo "$TAG APK signing certificate SHA-256: $OLD_CERT"
            if [ "$NEW_CERT" != "$OLD_CERT" ]; then
              echo "::error::The new APK is not signed with the same certificate as $TAG. In-app update installation could fail; no release will be published."
              exit 1
            fi
          done

          echo "Signing certificate matches all existing public releases; update signing compatibility verified."

      - name: Prepare Release Assets
        run: |
          mkdir -p release-artifacts
          APK_FILE=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -iname '*unsigned*' | sort | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Signed Release APK not found!"
            find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print || true
            exit 1
          fi
          cp "$APK_FILE" release-artifacts/voicebubble.apk
          
          cd release-artifacts
          sha256sum voicebubble.apk | awk '{print $1}' > voicebubble.apk.sha256
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/v') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            release-artifacts/voicebubble.apk
            release-artifacts/voicebubble.apk.sha256
          name: Release ${{ env.TAG_NAME }}
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
