name: Build & Release Voice Bubble APK

on:
  push:
    branches:
      - 'release/v*' # Release branch push করে সংস্করণ প্রকাশ
    tags:
      - 'v*' # যেমন: v1.0.1 ট্যাগ পুশ করলেও চলবে
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Version Tag (e.g., v1.0.1)'
        required: false
        default: 'v1.0.0'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Extract Version Tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version_tag }}" ]; then
            TAG_NAME="${{ github.event.inputs.version_tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          elif [[ "$GITHUB_REF" == refs/heads/release/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/heads/release/}"
          else
            echo "::error::Unable to determine release tag from ref: $GITHUB_REF"
            exit 1
          fi
          VERSION_NAME="${TAG_NAME#v}"
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

      - name: Validate Stable Signing Key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::A stable release keystore must be configured in repository secrets before publishing an in-app update."
            exit 1
          fi
          echo "Stable release signing secrets are configured."

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
            echo "Keystore decoded successfully."
          else
            echo "No production keystore secret found, fallback to debug signing."
          fi

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease -PversionName=${{ env.VERSION_NAME }} --stacktrace

      - name: Prepare Release Assets
        run: |
          mkdir -p release-artifacts
          APK_FILE=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Release APK not found!"
            exit 1
          fi
          cp "$APK_FILE" release-artifacts/voicebubble.apk
          
          cd release-artifacts
          sha256sum voicebubble.apk | awk '{print $1}' > voicebubble.apk.sha256
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/v') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            release-artifacts/voicebubble.apk
            release-artifacts/voicebubble.apk.sha256
          name: Release ${{ env.TAG_NAME }}
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
